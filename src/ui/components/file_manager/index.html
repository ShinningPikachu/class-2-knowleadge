<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      color-scheme: light dark;
      --text: #31333f;
      --muted: #687083;
      --surface: #ffffff;
      --soft: #f7f8fb;
      --border: #d9dde7;
      --accent: #ff4b4b;
      --accent-soft: rgba(255, 75, 75, 0.10);
      --shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button { color: inherit; font: inherit; }
    .explorer {
      min-height: 430px;
      display: grid;
      grid-template-columns: 176px minmax(0, 1fr);
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }
    .sidebar {
      padding: 12px 9px;
      border-right: 1px solid var(--border);
      background: var(--soft);
    }
    .sidebar-title {
      padding: 0 8px 8px;
      color: var(--muted);
      font-size: 0.70rem;
      font-weight: 750;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .location {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 2px 0;
      padding: 8px;
      border: 1px solid transparent;
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
      text-align: left;
      transition: background 100ms ease, border-color 100ms ease;
    }
    .location:hover { background: var(--surface); }
    .location.active {
      border-color: var(--border);
      background: var(--surface);
      font-weight: 650;
    }
    .location.drag-over {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .location-icon { flex: none; font-size: 1.05rem; }
    .location-copy { min-width: 0; flex: 1; }
    .location-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.80rem;
    }
    .location-count { margin-top: 1px; color: var(--muted); font-size: 0.66rem; }
    .content {
      min-width: 0;
      padding: 13px 15px 16px;
      transition: background 100ms ease, box-shadow 100ms ease;
    }
    .content.drag-over {
      background: var(--accent-soft);
      box-shadow: inset 0 0 0 2px var(--accent);
    }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 34px;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .breadcrumb {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 0.87rem;
      font-weight: 650;
    }
    .folder-actions { position: relative; flex: none; }
    .menu-trigger {
      width: 32px;
      height: 30px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      cursor: pointer;
      font-size: 1.1rem;
      line-height: 1;
    }
    .menu-trigger:hover { background: var(--soft); }
    .folder-menu {
      position: absolute;
      z-index: 20;
      top: 35px;
      right: 0;
      width: 210px;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.18);
    }
    .folder-menu[hidden] { display: none; }
    .menu-title {
      padding: 4px 6px 8px;
      overflow: hidden;
      color: var(--muted);
      font-size: 0.70rem;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .menu-action {
      width: 100%;
      margin: 2px 0;
      padding: 8px 9px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      cursor: pointer;
      text-align: left;
      font-size: 0.78rem;
    }
    .menu-action:hover { background: var(--soft); }
    .menu-action.danger { color: #d13b3b; }
    .menu-field {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-size: 0.78rem;
    }
    .menu-row { display: flex; gap: 6px; margin-top: 7px; }
    .menu-row .menu-action { text-align: center; }
    .menu-copy { padding: 4px 6px; color: var(--muted); font-size: 0.72rem; line-height: 1.35; }
    .section-label {
      margin: 12px 0 7px;
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 750;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .item-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
      gap: 9px;
    }
    .item {
      min-width: 0;
      min-height: 108px;
      padding: 11px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: transparent;
      cursor: pointer;
      text-align: left;
      user-select: none;
      transition: border-color 100ms ease, background 100ms ease, transform 100ms ease;
    }
    .item:hover {
      border-color: var(--border);
      background: var(--soft);
    }
    .item.selected {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .item.drag-over {
      border-color: var(--accent);
      background: var(--accent-soft);
      transform: translateY(-1px);
    }
    .item.dragging { opacity: 0.42; cursor: grabbing; }
    .item-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 7px;
    }
    .item-icon { font-size: 2rem; line-height: 1; }
    .extension {
      padding: 2px 5px;
      border-radius: 999px;
      background: var(--soft);
      color: var(--muted);
      font-size: 0.60rem;
      font-weight: 750;
      letter-spacing: 0.04em;
    }
    .item-name {
      display: -webkit-box;
      margin-top: 9px;
      overflow: hidden;
      font-size: 0.76rem;
      font-weight: 620;
      line-height: 1.25;
      overflow-wrap: anywhere;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }
    .folder-item .item-icon { font-size: 2.2rem; }
    .empty {
      display: grid;
      min-height: 260px;
      place-items: center;
      color: var(--muted);
      font-size: 0.84rem;
      text-align: center;
    }
    .status {
      min-height: 18px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.71rem;
    }
    .status:empty { display: none; }
    @media (max-width: 620px) {
      .explorer { grid-template-columns: 1fr; }
      .sidebar {
        display: flex;
        gap: 4px;
        overflow-x: auto;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }
      .sidebar-title { display: none; }
      .location { min-width: 130px; }
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text: #fafafa;
        --muted: #a7adba;
        --surface: #15171c;
        --soft: #20232b;
        --border: #3a3f4b;
        --shadow: 0 2px 8px rgba(0, 0, 0, 0.24);
      }
    }
  </style>
</head>
<body>
  <main id="app"></main>
  <script>
    const app = document.getElementById("app");
    let currentArgs = { folders: [], documents: [], current_folder_id: "", selected_document_id: "" };
    let didDrag = false;
    let pendingFileOpen = null;
    const MAX_DIRECT_DROP_FILE_BYTES = 64 * 1024 * 1024;
    const MAX_DIRECT_DROP_TOTAL_BYTES = 96 * 1024 * 1024;

    function send(type, payload = {}) {
      window.parent.postMessage({ isStreamlitMessage: true, type, ...payload }, "*");
    }

    function setHeight() {
      window.requestAnimationFrame(() => {
        send("streamlit:setFrameHeight", { height: app.scrollHeight + 4 });
      });
    }

    function setValue(value) {
      send("streamlit:setComponentValue", { value, dataType: "json" });
    }

    function event(action, values = {}) {
      setValue({
        action,
        ...values,
        event_id: `${Date.now()}-${Math.random().toString(16).slice(2)}`
      });
    }

    function openFullPage(documentId) {
      const streamlitUrl = new URLSearchParams(window.location.search).get("streamlitUrl");
      const url = new URL(streamlitUrl || window.parent.location.href);
      url.searchParams.set("open_file", documentId);
      window.open(url.toString(), "_blank", "noopener");
    }

    function applyTheme(theme) {
      if (!theme) return;
      const root = document.documentElement.style;
      if (theme.textColor) root.setProperty("--text", theme.textColor);
      if (theme.secondaryBackgroundColor) root.setProperty("--soft", theme.secondaryBackgroundColor);
      if (theme.backgroundColor) root.setProperty("--surface", theme.backgroundColor);
      if (theme.primaryColor) {
        root.setProperty("--accent", theme.primaryColor);
        root.setProperty("--accent-soft", `${theme.primaryColor}1a`);
      }
      if (theme.font) document.body.style.fontFamily = theme.font;
    }

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function makeFolderMenu(folder) {
      const wrapper = element("div", "folder-actions");
      const trigger = element("button", "menu-trigger", "⋯");
      trigger.type = "button";
      trigger.title = "Folder actions";
      trigger.setAttribute("aria-label", `Actions for ${folder.name}`);
      const menu = element("div", "folder-menu");
      menu.hidden = true;

      function addTitle() {
        menu.appendChild(element("div", "menu-title", folder.name));
      }

      function renderActions() {
        menu.replaceChildren();
        addTitle();
        if (!folder.id) {
          const create = element("button", "menu-action", "New folder");
          create.type = "button";
          create.addEventListener("click", (eventObject) => {
            eventObject.stopPropagation();
            renderCreate();
          });
          menu.appendChild(create);
          return;
        }
        const rename = element("button", "menu-action", "Rename");
        rename.type = "button";
        rename.addEventListener("click", (eventObject) => {
          eventObject.stopPropagation();
          renderRename();
        });
        const remove = element("button", "menu-action danger", "Delete");
        remove.type = "button";
        remove.addEventListener("click", (eventObject) => {
          eventObject.stopPropagation();
          renderDelete();
        });
        menu.append(rename, remove);
      }

      function renderCreate() {
        menu.replaceChildren();
        addTitle();
        const input = element("input", "menu-field");
        input.type = "text";
        input.maxLength = 120;
        input.placeholder = "Folder name";
        input.setAttribute("aria-label", "Folder name");
        const row = element("div", "menu-row");
        const create = element("button", "menu-action", "Create");
        create.type = "button";
        const cancel = element("button", "menu-action", "Cancel");
        cancel.type = "button";
        const submit = () => {
          const name = input.value.trim();
          if (!name) {
            input.focus();
            return;
          }
          event("create_folder", { name });
        };
        create.addEventListener("click", submit);
        input.addEventListener("keydown", (eventObject) => {
          if (eventObject.key === "Enter") submit();
          if (eventObject.key === "Escape") renderActions();
        });
        cancel.addEventListener("click", renderActions);
        row.append(create, cancel);
        menu.append(input, row);
        input.focus();
      }

      function renderRename() {
        menu.replaceChildren();
        addTitle();
        const input = element("input", "menu-field");
        input.type = "text";
        input.maxLength = 120;
        input.value = folder.name;
        input.setAttribute("aria-label", "Folder name");
        const row = element("div", "menu-row");
        const save = element("button", "menu-action", "Save");
        save.type = "button";
        const cancel = element("button", "menu-action", "Cancel");
        cancel.type = "button";
        const submit = () => {
          const newName = input.value.trim();
          if (!newName) {
            input.focus();
            return;
          }
          event("rename_folder", { folder_id: folder.id, new_name: newName });
        };
        save.addEventListener("click", submit);
        input.addEventListener("keydown", (eventObject) => {
          if (eventObject.key === "Enter") submit();
          if (eventObject.key === "Escape") renderActions();
        });
        cancel.addEventListener("click", renderActions);
        row.append(save, cancel);
        menu.append(input, row);
        input.focus();
        input.select();
      }

      function renderDelete() {
        menu.replaceChildren();
        addTitle();
        const count = Number(folder.document_count || 0);
        menu.appendChild(
          element(
            "div",
            "menu-copy",
            count
              ? `Delete this folder and its ${count} file${count === 1 ? "" : "s"}?`
              : "Delete this empty folder?"
          )
        );
        const row = element("div", "menu-row");
        const confirm = element("button", "menu-action danger", "Delete");
        confirm.type = "button";
        confirm.addEventListener("click", () => {
          event("delete_folder", { folder_id: folder.id });
        });
        const cancel = element("button", "menu-action", "Cancel");
        cancel.type = "button";
        cancel.addEventListener("click", renderActions);
        row.append(confirm, cancel);
        menu.appendChild(row);
      }

      trigger.addEventListener("click", (eventObject) => {
        eventObject.stopPropagation();
        menu.hidden = !menu.hidden;
        if (!menu.hidden) renderActions();
      });
      wrapper.append(trigger, menu);
      return wrapper;
    }

    function readAsBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error(`Could not read ${file.name}.`));
        reader.onload = () => {
          const result = String(reader.result || "");
          const comma = result.indexOf(",");
          resolve(comma === -1 ? result : result.slice(comma + 1));
        };
        reader.readAsDataURL(file);
      });
    }

    async function uploadFiles(files, targetFolder, status) {
      const targetName = targetFolder.name || "Subject root";
      const tooLarge = files.filter((file) => file.size > MAX_DIRECT_DROP_FILE_BYTES);
      const uploadable = files.filter((file) => file.size <= MAX_DIRECT_DROP_FILE_BYTES);
      const totalBytes = uploadable.reduce((total, file) => total + file.size, 0);
      if (!uploadable.length) {
        status.textContent = "Each dropped file must be 64 MB or smaller.";
        return;
      }
      if (totalBytes > MAX_DIRECT_DROP_TOTAL_BYTES) {
        status.textContent = "Drop fewer files at once (up to 96 MB total).";
        return;
      }
      status.textContent = `Uploading ${uploadable.length} file${uploadable.length === 1 ? "" : "s"} to ${targetName}…`;
      try {
        const uploads = await Promise.all(
          uploadable.map(async (file) => ({ name: file.name, data: await readAsBase64(file) }))
        );
        if (tooLarge.length) {
          status.textContent = `${tooLarge.length} file${tooLarge.length === 1 ? " is" : "s are"} too large; uploading the rest…`;
        }
        event("upload", {
          folder_id: targetFolder.id || "",
          files: uploads,
          skipped_too_large: tooLarge.map((file) => file.name)
        });
      } catch (error) {
        status.textContent = error instanceof Error ? error.message : "Could not read the dropped files.";
      }
    }

    function dropFile(eventObject, targetFolder, status) {
      eventObject.preventDefault();
      eventObject.stopPropagation();
      const droppedFiles = Array.from((eventObject.dataTransfer && eventObject.dataTransfer.files) || []);
      if (droppedFiles.length) {
        uploadFiles(droppedFiles, targetFolder, status);
        return;
      }
      const documentId = eventObject.dataTransfer && eventObject.dataTransfer.getData("text/plain");
      const file = (currentArgs.documents || []).find((item) => item.id === documentId);
      if (!file) return;
      const targetId = targetFolder.id || "";
      if ((file.folder_id || "") === targetId) {
        status.textContent = `${file.name} is already in ${targetFolder.name}.`;
        return;
      }
      status.textContent = `Moving ${file.name} to ${targetFolder.name}…`;
      event("move", { document_id: file.id, folder_id: targetId });
    }

    function makeDropTarget(node, folder, status) {
      node.addEventListener("dragover", (eventObject) => {
        eventObject.preventDefault();
        if (eventObject.dataTransfer) {
          eventObject.dataTransfer.dropEffect = eventObject.dataTransfer.files.length ? "copy" : "move";
        }
        node.classList.add("drag-over");
      });
      node.addEventListener("dragleave", () => node.classList.remove("drag-over"));
      node.addEventListener("drop", (eventObject) => {
        node.classList.remove("drag-over");
        dropFile(eventObject, folder, status);
      });
    }

    function render(args, theme) {
      currentArgs = args || currentArgs;
      applyTheme(theme);
      app.replaceChildren();

      const folders = currentArgs.folders || [];
      const documents = currentArgs.documents || [];
      const currentId = currentArgs.current_folder_id || "";
      const currentFolder = folders.find((folder) => (folder.id || "") === currentId) || folders[0];
      const visibleFiles = documents.filter((file) => (file.folder_id || "") === currentId);

      const explorer = element("div", "explorer");
      const sidebar = element("aside", "sidebar");
      sidebar.appendChild(element("div", "sidebar-title", "Locations"));
      const content = element("section", "content");
      const status = element("div", "status");
      makeDropTarget(content, currentFolder || { id: "", name: "Subject root" }, status);

      folders.forEach((folder) => {
        const location = element("button", "location");
        location.type = "button";
        if ((folder.id || "") === currentId) location.classList.add("active");
        location.appendChild(element("span", "location-icon", folder.icon || "📁"));
        const copy = element("span", "location-copy");
        copy.appendChild(element("div", "location-name", folder.name));
        const count = Number(folder.document_count || 0);
        copy.appendChild(element("div", "location-count", `${count} file${count === 1 ? "" : "s"}`));
        location.appendChild(copy);
        location.addEventListener("click", () => {
          event("browse", { folder_id: folder.id || "" });
        });
        makeDropTarget(location, folder, status);
        sidebar.appendChild(location);
      });

      const toolbar = element("div", "toolbar");
      toolbar.appendChild(
        element("div", "breadcrumb", `Subject / ${currentFolder ? currentFolder.name : "Subject root"}`)
      );
      if (currentFolder) toolbar.appendChild(makeFolderMenu(currentFolder));
      content.appendChild(toolbar);

      if (!currentId && folders.length > 1) {
        content.appendChild(element("div", "section-label", "Folders"));
        const folderGrid = element("div", "item-grid");
        folders.slice(1).forEach((folder) => {
          const tile = element("button", "item folder-item");
          tile.type = "button";
          tile.appendChild(element("div", "item-icon", folder.icon || "📁"));
          tile.appendChild(element("div", "item-name", folder.name));
          tile.addEventListener("click", () => {
            if (!didDrag) event("browse", { folder_id: folder.id || "" });
          });
          makeDropTarget(tile, folder, status);
          folderGrid.appendChild(tile);
        });
        content.appendChild(folderGrid);
      }

      if (visibleFiles.length) {
        content.appendChild(element("div", "section-label", "Files"));
        const fileGrid = element("div", "item-grid");
        visibleFiles.forEach((file) => {
          const tile = element("button", "item file-item");
          tile.type = "button";
          tile.draggable = true;
          tile.title = file.name;
          if (file.id === currentArgs.selected_document_id) tile.classList.add("selected");
          const top = element("div", "item-top");
          top.appendChild(element("div", "item-icon", file.icon || "📎"));
          top.appendChild(element("span", "extension", file.extension || "FILE"));
          tile.appendChild(top);
          tile.appendChild(element("div", "item-name", file.name));
          tile.addEventListener("click", () => {
            if (didDrag) return;
            window.clearTimeout(pendingFileOpen);
            pendingFileOpen = window.setTimeout(() => {
              event("open", { document_id: file.id });
            }, 220);
          });
          tile.addEventListener("dblclick", (eventObject) => {
            eventObject.preventDefault();
            window.clearTimeout(pendingFileOpen);
            openFullPage(file.id);
          });
          tile.addEventListener("dragstart", (eventObject) => {
            didDrag = true;
            tile.classList.add("dragging");
            if (eventObject.dataTransfer) {
              eventObject.dataTransfer.effectAllowed = "move";
              eventObject.dataTransfer.setData("text/plain", file.id);
            }
          });
          tile.addEventListener("dragend", () => {
            tile.classList.remove("dragging");
            window.setTimeout(() => { didDrag = false; }, 0);
          });
          fileGrid.appendChild(tile);
        });
        content.appendChild(fileGrid);
      } else if (currentId || folders.length <= 1) {
        content.appendChild(
          element("div", "empty", "Drop local files here to upload them, or drag a stored file to a folder to move it.")
        );
      }

      content.appendChild(status);
      explorer.appendChild(sidebar);
      explorer.appendChild(content);
      app.appendChild(explorer);
      setHeight();
    }

    window.addEventListener("message", (message) => {
      if (message.data && message.data.type === "streamlit:render") {
        render(message.data.args || {}, message.data.theme || {});
      }
    });
    send("streamlit:componentReady", { apiVersion: 1 });
    setHeight();
  </script>
</body>
</html>
